<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heart Rate — Personal Health</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <script>
    (function () {
      var theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <a class="back-link" href="../index.html">&larr; Dashboard</a>

  <header class="app-header" id="page-header"></header>

  <p id="status" class="status" role="status"></p>

  <section class="card">
    <canvas id="chart" class="detail-chart"></canvas>
  </section>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Date</th><th>Resting BPM</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script type="module" src="../js/pages/heart-rate.js"></script>
</body>
</html>
