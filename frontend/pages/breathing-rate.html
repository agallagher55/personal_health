<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breathing Rate — Personal Health</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <a class="back-link" href="../index.html">&larr; Dashboard</a>

  <header class="app-header">
    <h1>Breathing Rate</h1>
    <form class="range-controls" id="range-form">
      <label>From <input type="date" id="range-from" /></label>
      <label>To <input type="date" id="range-to" /></label>
      <button type="submit">Apply</button>
    </form>
  </header>

  <p id="status" class="status" role="status"></p>

  <section class="card">
    <canvas id="chart" class="detail-chart"></canvas>
  </section>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Date</th><th>Breathing Rate</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script type="module" src="../js/pages/breathing-rate.js"></script>
</body>
</html>
