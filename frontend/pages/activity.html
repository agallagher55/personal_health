<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activity — Personal Health</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <a class="back-link" href="../index.html">&larr; Dashboard</a>

  <header class="app-header" id="page-header"></header>

  <p id="status" class="status" role="status"></p>

  <section class="card">
    <canvas id="chart" class="detail-chart"></canvas>
    <div class="card-sublabel">Total active minutes per day</div>
  </section>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Date</th><th>Type</th><th>Duration</th><th>Calories</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script type="module" src="../js/pages/activity.js"></script>
</body>
</html>
